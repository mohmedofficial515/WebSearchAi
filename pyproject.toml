[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "websearchai"
version = "0.1.0"
description = "Professional AI-driven browser automation — give it a goal, it drives a real browser like a human."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "WebSearchAi contributors" }]
keywords = ["browser-automation", "playwright", "llm", "mistral", "ai-agent", "web-scraping"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "playwright>=1.49",
    "playwright-stealth>=1.0",
    "mistralai>=1.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=13",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "typer>=0.13",
    "rich>=13.9",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "html2text>=2024.2.26",
    "tenacity>=9.0",
    "aiofiles>=24.1",
    "aiosqlite>=0.20",
    "pillow>=11.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-mock>=3.14",
    "respx>=0.21",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-aiofiles",
    "pre-commit>=4.0",
]

[project.scripts]
websearchai = "src.cli:app"

[project.urls]
Homepage = "https://github.com/yourusername/WebSearchAi"
Documentation = "https://github.com/yourusername/WebSearchAi/tree/main/docs"
Issues = "https://github.com/yourusername/WebSearchAi/issues"

# ──────────────────────────────────────────────────────────────────────
# setuptools
# ──────────────────────────────────────────────────────────────────────
[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
exclude = ["tests*", "outputs*", "web*"]

# ──────────────────────────────────────────────────────────────────────
# ruff — formatter + linter
# ──────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
exclude = [".venv", "outputs", "web", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "RUF",  # ruff-specific
    "ASYNC",
    "SIM",  # simplify
]
ignore = [
    "E501",  # line too long — formatter handles
    "B008",  # function call in default arg — FastAPI uses this
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "SIM"]
"__init__.py" = ["F401"]  # re-exports OK

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ──────────────────────────────────────────────────────────────────────
# pytest
# ──────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
asyncio_mode = "auto"
markers = [
    "unit: fast, hermetic tests with no I/O",
    "integration: needs Playwright + real browser",
    "slow: takes > 10 seconds",
    "e2e: end-to-end against external sites",
]

# ──────────────────────────────────────────────────────────────────────
# coverage
# ──────────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__init__.py",
]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "\\.\\.\\.",
]
show_missing = true
skip_covered = false

# ──────────────────────────────────────────────────────────────────────
# mypy
# ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
files = ["src"]

[[tool.mypy.overrides]]
module = "src.core.*"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["playwright.*", "mistralai.*"]
ignore_missing_imports = true
