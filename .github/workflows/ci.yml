name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ruff + mypy
        run: pip install ruff mypy
      - name: Ruff lint
        run: ruff check src tests
      - name: Ruff format check
        run: ruff format --check src tests
      - name: Mypy
        run: mypy src || true   # advisory until coverage improves

  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Pytest (unit only)
        run: pytest tests/unit -q --cov=src --cov-report=xml
        env:
          MISTRAL_API_KEY: "test-placeholder"
      - name: Upload coverage
        if: matrix.python == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  integration:
    runs-on: ubuntu-latest
    # Integration runs on PRs against main, but not on every push
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
          python -m playwright install --with-deps chromium
      - name: Pytest (integration)
        run: pytest tests/integration -q -m "not slow and not e2e"
        env:
          MISTRAL_API_KEY: "test-placeholder"
          BROWSER_HEADLESS: "true"

  docker:
    runs-on: ubuntu-latest
    needs: [lint, unit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push — sanity check only)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: websearchai:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
